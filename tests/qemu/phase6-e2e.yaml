# ouroborOS E2E test config — Phase 6 feature validation
#
# Used by: sudo bash src/scripts/build-iso.sh --e2e-config=tests/qemu/phase6-e2e.yaml
# Tests v0.6.0 features: our-wall (firewalld), ouroboros-install launcher,
# Textual TUI files present, Thunderbolt not detected in QEMU.
#
# QEMU constraints:
#   homed_storage: classic  — homectl create fails in QEMU (Btrfs subvolume conflict)
#   secure_boot: false      — sbctl requires real UEFI Setup Mode (OVMF limitation)
#   wifi: omitted           — iwd not used in QEMU SLIRP network
#   thunderbolt: none       — no Thunderbolt hardware in QEMU → bolt must NOT be installed

disk:
  device: /dev/vda
  use_luks: false
  btrfs_label: ouroborOS
  swap_type: zram

locale:
  locale: en_US.UTF-8
  keymap: us
  timezone: UTC

network:
  hostname: ouroboros-p6
  enable_networkd: true
  enable_iwd: false
  enable_resolved: true

users:
  - username: admin
    password: changeme
    real_name: "Administrator"
    groups:
      - wheel
      - audio
      - video
      - input
    homed_storage: classic
    tpm2_enroll: false
    fido2_enroll: false

shell: bash

desktop:
  profile: minimal
  dm: none

security:
  secure_boot: false
  sbctl_include_ms_keys: false
  fido2_pam: false

extra_packages:
  - openssh
  - firewalld
  - linux-firmware-other
  - linux-firmware-whence
