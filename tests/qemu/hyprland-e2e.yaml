# ouroborOS E2E test config — Hyprland profile
#
# Used by: sudo bash src/scripts/build-iso.sh --e2e-config=tests/qemu/hyprland-e2e.yaml
# Credentials: root/toor, admin/admin
#
# QEMU constraints:
#   homed_storage: classic  — homectl create fails in QEMU (Btrfs subvolume conflict)
#   secure_boot: false      — sbctl requires real UEFI Setup Mode (OVMF limitation)
#   wifi: omitted           — iwd not used in QEMU SLIRP network
#   post_install_action: shutdown — QEMU must power off after install so wait_qemu_exit() returns

disk:
  device: /dev/vda
  use_luks: false
  btrfs_label: ouroborOS
  swap_type: zram

locale:
  locale: en_US.UTF-8
  keymap: us
  timezone: UTC

network:
  hostname: ouroboros-hypr
  enable_networkd: true
  enable_iwd: false
  enable_resolved: true

root_password: "toor"

users:
  - username: admin
    password: "admin"
    real_name: "Admin User"
    groups:
      - wheel
      - audio
      - video
      - input
    homed_storage: classic
    tpm2_enroll: false
    fido2_enroll: false

shell: bash

desktop:
  profile: hyprland
  dm: none

security:
  secure_boot: false
  sbctl_include_ms_keys: false
  fido2_pam: false

post_install_action: shutdown

extra_packages:
  - openssh
  - firewalld
  - python-firewall
  - python-dbus
  - linux-firmware-other
  - linux-firmware-whence
