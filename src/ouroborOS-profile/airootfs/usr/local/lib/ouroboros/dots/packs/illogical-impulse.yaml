id: illogical-impulse
name: illogical-impulse
description: |
  end-4's popular Hyprland rice built on Quickshell, widely recognized for
  its polished aesthetic and active community. The setup script handles the
  full dependency chain. On ouroborOS, installation requires temporarily
  remounting / as writable to add an IgnoreGroup entry to /etc/pacman.conf —
  our-dots will explicitly confirm this action before proceeding.

credits:
  author: end-4
  homepage: https://ii.clsty.link/en/ii-qs/01setup/
  repo: https://github.com/end-4/dots-hyprland
  docs: https://ii.clsty.link/en/ii-qs/01setup/
  license: (see project repository)

compatibility:
  immutable: critical
  profiles: [hyprland]
  compatibility_note: Requires /etc/pacman.conf modification on the live system
  compatibility_warning: |
    This pack requires modifying /etc/pacman.conf (adding IgnoreGroup=illogical-impulse)
    on a read-only root filesystem. ouroborOS will temporarily remount / as writable
    during the edit and restore read-only mode immediately after.
  critical_actions:
    - "Remount / as read-write (temporary)"
    - "Add 'IgnoreGroup=illogical-impulse' to /etc/pacman.conf"
    - "Remount / as read-only"
    - "Install dependencies via our-pac and our-aur"
    - "Clone dots-hyprland and run ./setup install as your user"

requires_root: true

variants:
  stable:
    packages: [git]
    aur: []
    post_deploy: |
      git clone https://github.com/end-4/dots-hyprland /tmp/dots-hyprland
      cd /tmp/dots-hyprland && ./setup install
    version_hint: "rolling (git)"

uninstall:
  packages: []
  aur: []
  post_remove: |
    cd /tmp/dots-hyprland 2>/dev/null && ./setup uninstall 2>/dev/null || true
  remove_config: false

signature: null
