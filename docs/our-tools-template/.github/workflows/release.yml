name: release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  # ── 1. Run full test suite before releasing ───────────────────────────────
  test:
    name: pre-release tests
    uses: ./.github/workflows/test.yml

  # ── 2. Build the .pkg.tar.zst via makepkg ────────────────────────────────
  build-pkg:
    name: build PKGBUILD
    runs-on: ubuntu-latest
    needs: test
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      - name: Update pacman and install build deps
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git sudo

      - name: Create build user (makepkg refuses to run as root)
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .

      - name: Set package version from tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          sed -i "s/^pkgver=.*/pkgver=${TAG}/" PKGBUILD

      - name: Build package
        run: sudo -u builder makepkg -s --noconfirm

      - name: Collect artifact
        run: ls -lh *.pkg.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: pkg
          path: "*.pkg.tar.zst"

  # ── 3. Create GitHub release (private repo) with the .pkg attached ────────
  release-private:
    name: release (private)
    runs-on: ubuntu-latest
    needs: build-pkg
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: pkg

      - name: Create release on private repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes "$(git log --format='%s' $(git describe --tags --abbrev=0 HEAD^)..HEAD | sed 's/^/- /')" \
            *.pkg.tar.zst

  # ── 4. Mirror to public repo ──────────────────────────────────────────────
  # Requires a secret MIRROR_TOKEN with write access to the public repo.
  # The public repo is named: Arkh-Ur/<tool-name> (without -dev suffix).
  mirror-public:
    name: mirror to public repo
    runs-on: ubuntu-latest
    needs: release-private
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to public mirror
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          TOOL_NAME="${GITHUB_REPOSITORY##*/}"
          git remote add public \
            "https://x-access-token:${MIRROR_TOKEN}@github.com/Arkh-Ur/${TOOL_NAME}.git"
          git push public HEAD:main --tags

      - uses: actions/download-artifact@v4
        with:
          name: pkg

      - name: Create release on public repo
        env:
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          TOOL_NAME="${GITHUB_REPOSITORY##*/}"
          gh release create "${TAG}" \
            --repo "Arkh-Ur/${TOOL_NAME}" \
            --title "${TAG}" \
            --notes "$(git log --format='%s' $(git describe --tags --abbrev=0 HEAD^)..HEAD | sed 's/^/- /')" \
            *.pkg.tar.zst
