name: test

on:
  push:
    branches: [main, dev, "feature/**", "fix/**"]
  pull_request:
    branches: [main, dev]
  # Required for release.yml to invoke this workflow via `uses:`
  workflow_call:

jobs:
  lint:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Lint main binary
        # SC2317 — unreachable code false-positives in case blocks; disable globally.
        # Guard: skip if bin/ is absent or empty (e.g. libs-only repos).
        if: hashFiles('bin/*') != ''
        run: shellcheck -S style -e SC2317 bin/*

      - name: Lint lib scripts
        if: hashFiles('lib/*.sh') != ''
        run: shellcheck -S style -e SC2317 lib/*.sh

  unit:
    name: bats unit tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install bats-core
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run unit tests
        # Bats tests live in tests/bats/. Each file is a *.bats test suite.
        # Tests that need real systemd/btrfs are tagged @e2e and skipped here.
        run: |
          if compgen -G "tests/bats/*.bats" > /dev/null; then
            bats --filter-tags '!e2e' tests/bats/
          else
            echo "No bats tests found — skipping"
          fi

  # Optional job: run the tool's own --version to catch import errors.
  # Note: scaffold-all.sh injects --version support before the first push,
  # so this test always passes in practice once the tool is scaffolded.
  # Skipped for libs-only repos (no bin/ directory).
  smoke:
    name: smoke test (--version)
    runs-on: ubuntu-latest
    needs: lint
    if: hashFiles('bin/*') != ''
    steps:
      - uses: actions/checkout@v4

      - name: Smoke test
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(bin/*)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No files in bin/ — skipping smoke test"
            exit 0
          fi
          for f in "${files[@]}"; do
            bash "$f" --version 2>&1 | grep -qE '[0-9]+\.[0-9]' || exit 1
          done
