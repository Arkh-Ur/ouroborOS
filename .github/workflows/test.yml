name: Test Suite

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  test-shell-validation:
    name: Shell validation
    runs-on: self-hosted
    steps:
      - name: Clean root-owned artifacts from previous run
        run: sudo rm -rf "${GITHUB_WORKSPACE:?}/*" 2>/dev/null || true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Run shellcheck suite
        env:
          WORKSPACE: ${{ github.workspace }}
        run: bash "$WORKSPACE/tests/scripts/test-shellcheck.sh"

      - name: Run validate-scripts
        env:
          WORKSPACE: ${{ github.workspace }}
        run: bash "$WORKSPACE/tests/scripts/validate-scripts.sh"

      - name: Run dry-run build test
        env:
          WORKSPACE: ${{ github.workspace }}
        run: bash "$WORKSPACE/tests/scripts/test-build-dry-run.sh"

  test-python:
    name: Python tests
    runs-on: self-hosted
    steps:
      - name: Clean root-owned artifacts from previous run
        run: sudo rm -rf "${GITHUB_WORKSPACE:?}/*" 2>/dev/null || true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Run Python lint
        env:
          WORKSPACE: ${{ github.workspace }}
        run: bash "$WORKSPACE/tests/scripts/lint-python.sh"

      - name: Run pytest
        env:
          WORKSPACE: ${{ github.workspace }}
        run: bash "$WORKSPACE/tests/scripts/run-pytest.sh"

  test-profile-smoke:
    name: Profile smoke test
    runs-on: self-hosted
    steps:
      - name: Clean root-owned artifacts from previous run
        run: sudo rm -rf "${GITHUB_WORKSPACE:?}/*" 2>/dev/null || true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Run smoke test
        env:
          WORKSPACE: ${{ github.workspace }}
        run: bash "$WORKSPACE/tests/scripts/smoke-test.sh"

  report:
    name: Test report
    needs: [test-shell-validation, test-python, test-profile-smoke]
    runs-on: self-hosted
    if: always()
    steps:
      - name: Write job summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'
          ## ouroborOS Test Suite Results

          | Suite | Status |
          |-------|--------|
          | Shell validation | ${{ needs.test-shell-validation.result }} |
          | Python tests | ${{ needs.test-python.result }} |
          | Profile smoke test | ${{ needs.test-profile-smoke.result }} |

          **Triggered by:** `${{ github.event_name }}` on `${{ github.ref_name }}`
          **Commit:** `${{ github.sha }}`
          EOF
